[package]
name = "yappytuberplus"
version = "1.0.0"
description = "High-performance PNG sprite rig studio"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "yappytuberplus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "windows")'.dependencies]
# Глобальный хук ввода: только слушает, ничего не перехватывает.
rdev = "0.5"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rig-core = { path = "../crates/rig-core" }
tauri-plugin-dialog = "2"
# Внешние источники: HTTP-опрос и SSE мимо CORS, UDP для OSC.
# rustls — чтобы сборка не зависела от OpenSSL в системе.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "stream"] }
tokio = { version = "1", features = ["net", "time", "rt", "sync"] }
