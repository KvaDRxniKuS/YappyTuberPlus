[package]
name = "yappytuberplus"
version = "0.1.0"
description = "High-performance PNG sprite rig studio"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "yappytuberplus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rig-core = { path = "../crates/rig-core" }
